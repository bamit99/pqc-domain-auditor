[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqc-domain-auditor"
version = "0.1.0"
description = "Passive subdomain discovery + Post-Quantum (ML-KEM) TLS readiness auditing with remediation guidance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit Bhatnagar" }]
keywords = ["post-quantum", "pqc", "ml-kem", "tls", "security", "audit", "subdomain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pqcaudit = "pqcaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pqcaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: typer.Option(...) in argument defaults is idiomatic for CLI apps.
# ISC004: adjacent string literals inside remediation text tuples are intentional.
ignore = ["B008", "ISC004"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
